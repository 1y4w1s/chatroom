<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>WebSocket 测试</title>
  <style>
    body { font-family: Arial; padding: 20px; }
    #log { 
      border: 1px solid #ccc; 
      height: 400px; 
      overflow-y: scroll; 
      padding: 10px;
      margin: 10px 0;
      background: #f9f9f9;
    }
    .message { margin: 5px 0; padding: 5px; background: #e3f2fd; }
    .error { background: #ffebee; color: #c62828; }
    .success { background: #e8f5e9; color: #2e7d32; }
    input, button { padding: 10px; margin: 5px; }
  </style>
</head>
<body>
  <h1>🔌 WebSocket 测试工具</h1>
  
  <div>
    <label>Token: </label>
    <input type="text" id="token" placeholder="输入 JWT Token" style="width: 400px;">
  </div>
  
  <div>
    <button onclick="connect()">连接</button>
    <button onclick="disconnect()">断开</button>
    <button onclick="joinRoom()">加入聊天室 1</button>
  </div>
  
  <div>
    <input type="text" id="messageInput" placeholder="输入消息..." style="width: 400px;">
    <button onclick="sendMessage()">发送</button>
  </div>
  
  <div id="log">
    <div class="message">等待连接...</div>
  </div>

  <script>
    let socket = null;
    
    function log(message, type = 'message') {
      const logDiv = document.getElementById('log');
      const div = document.createElement('div');
      div.className = `message ${type}`;
      div.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
      logDiv.appendChild(div);
      logDiv.scrollTop = logDiv.scrollHeight;
    }
    
    function connect() {
      const token = document.getElementById('token').value;
      if (!token) {
        log('请先输入 Token！', 'error');
        return;
      }
      
      socket = io('http://localhost:3000', {
        auth: { token }
      });
      
      socket.on('connect', () => {
        log('✅ WebSocket 连接成功！', 'success');
      });
      
      socket.on('disconnect', () => {
        log('❌ WebSocket 断开连接', 'error');
      });
      
      socket.on('new_message', (message) => {
        log(`📨 收到消息：${message.content}`, 'success');
      });
      
      socket.on('user_joined', (data) => {
        log(`👤 用户 ${data.username} 加入聊天室`);
      });
      
      socket.on('error', (error) => {
        log(`⚠️ 错误：${error.message}`, 'error');
      });
    }
    
    function disconnect() {
      if (socket) {
        socket.disconnect();
        log('已断开连接');
      }
    }
    
    function joinRoom() {
      if (!socket || !socket.connected) {
        log('请先连接！', 'error');
        return;
      }
      socket.emit('join_room', 1);
      log('已加入聊天室 1');
    }
    
    function sendMessage() {
      if (!socket || !socket.connected) {
        log('请先连接！', 'error');
        return;
      }
      
      const content = document.getElementById('messageInput').value;
      if (!content) {
        log('请输入消息内容！', 'error');
        return;
      }
      
      socket.emit('send_message', {
        roomId: 1,
        content: content,
        type: 'text'
      });
      
      log(`📤 发送消息：${content}`);
      document.getElementById('messageInput').value = '';
    }
  </script>
  
  <!-- 引入 Socket.io 客户端 -->
  <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
</body>
</html>
